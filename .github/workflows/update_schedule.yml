name: Validate HVF application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hvf-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install reminder cryptography
        run: npm exec --yes --package=pnpm@11.25.0 -- pnpm --dir backend/reminders install --frozen-lockfile --prod --ignore-scripts

      - name: Check JavaScript and regression tests
        run: |
          for file in app-config.js assistant-guide.js assistant-billing.js assistant-core.js assistant-forecast.js assistant-categories.js assistant-backup.js assistant-planner.js assistant-weekly.js assistant-navigation.js assistant-motion.js assistant-ui.js assistant-focus.js assistant-limits.js assistant-store.js assistant-extras.js assistant-reminders.js reminders-config.js pwa.js service-worker.js backend/reminders/worker.mjs backend/reminders/scripts/generate-vapid.mjs backend/billing/worker.mjs backend/app/worker.mjs scripts/build-public.mjs; do
            node --check "$file"
          done
          node --test tests/*.test.cjs

      - name: Validate static application
        run: python generate.py

      - name: Prepare public application files
        run: node scripts/build-public.mjs

      - name: Upload public build for review
        uses: actions/upload-artifact@v4
        with:
          name: hvf-public-build
          path: dist
          if-no-files-found: error
          retention-days: 7
