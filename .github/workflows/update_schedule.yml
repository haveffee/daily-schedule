name: Deploy HVF assistant

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check JavaScript and regression tests
        run: |
          for file in assistant-core.js assistant-ui.js assistant-ai.js assistant-store.js assistant-extras.js; do
            node --check "$file"
          done
          node --test tests/*.test.cjs

      - name: Validate static application
        run: python generate.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare public application files
        run: |
          mkdir -p _site
          cp index.html assistant.css assistant-finance.css assistant-core.js assistant-ui.js assistant-ai.js assistant-store.js assistant-extras.js firebase-config.js favicon.svg apple-touch-icon.png icon-192.png icon-512.png manifest.webmanifest _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
