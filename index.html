<html lang="ru">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HVF Ассистент">
  <title>HVF — личный помощник</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./assistant.css?v=4">
  <link rel="stylesheet" href="./assistant-finance.css?v=3">
  <link rel="stylesheet" href="./assistant-planner.css?v=2">
  <link rel="stylesheet" href="./assistant-reminders.css?v=1">
  <link rel="stylesheet" href="./assistant-focus.css?v=1">
  <link rel="stylesheet" href="./assistant-limits.css?v=1">
  <link rel="stylesheet" href="./assistant-update.css?v=2">
  <link rel="stylesheet" href="./assistant-sales.css?v=2">

  <script defer src="./assistant-core.js?v=4"></script>
  <script defer src="./assistant-forecast.js?v=1"></script>
  <script defer src="./assistant-planner.js?v=2"></script>
  <script defer src="./assistant-weekly.js?v=1"></script>
  <script defer src="./assistant-categories.js?v=1"></script>

  <script defer src="./assistant-extras.js?v=3"></script>
  <script defer src="./pwa.js?v=2"></script>
  <script defer src="./reminders-config.js"></script>
  <script defer src="./assistant-reminders.js?v=2"></script>
  <script defer src="./assistant-focus.js?v=1"></script>

</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>
  <aside class="sidebar">
    <a class="brand" href="#overview" aria-label="HVF, главная"><img src="./favicon.svg" width="44" height="44" alt=""><span>HVF<span class="brand-sub">личный помощник</span></span></a>
    <div class="sidebar-label">МОЁ ПРОСТРАНСТВО</div>
    <nav class="nav" aria-label="Главная навигация">
      <a href="#overview" data-view="overview"><span data-icon="home"></span><span>Обзор</span></a>
      <a href="#day" data-view="day"><span data-icon="calendar"></span><span>Мой день</span></a>
      <a href="#goals" data-view="goals"><span data-icon="target"></span><span>Цели месяца</span></a>
      <a href="#money" data-view="money"><span data-icon="wallet"></span><span>Финансы</span></a>
      <a href="#settings" data-view="settings"><span data-icon="settings"></span><span>Настройки</span></a>
    </nav>
    <div class="sidebar-bottom"><div class="sync-indicator"><i id="syncDot"></i><span id="syncShort">На этом устройстве</span></div><p id="syncDetail">Войди в Google на телефоне и компьютере, чтобы всё было рядом.</p><button id="accountButton" class="button secondary full" type="button">Войти через Google</button><small id="accountEmail"></small></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span class="topbar-title">Твоё личное пространство</span><div class="topbar-controls"><span class="timezone">Минск · UTC+3</span><label class="month-picker"><span class="sr-only">Выбрать месяц</span><input type="month" id="monthPicker" required></label><a class="avatar" id="syncBadge" href="#settings" aria-label="Настройки и синхронизация">H</a></div></header>
    <main id="main" tabindex="-1"><div id="content"></div></main>
    <footer>HVF <span>·</span> Место для твоих планов</footer>
  </div>
  <dialog id="editor" aria-labelledby="dialogTitle"><form id="editorForm"><header class="dialog-head"><div><p class="eyebrow" id="dialogEyebrow">ЛИЧНЫЙ ПОМОЩНИК</p><h2 id="dialogTitle"></h2></div><button type="button" class="icon-button" id="closeDialog" aria-label="Закрыть">×</button></header><div id="dialogFields"></div><p id="formError" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="button secondary" id="cancelDialog">Отмена</button><button type="submit" class="button" id="saveDialog">Сохранить</button></div></form></dialog>
  <div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button id="undoButton" type="button" hidden>Вернуть</button><button id="closeToast" type="button" aria-label="Закрыть уведомление">×</button></div>
  <noscript>Для работы помощника включи JavaScript в браузере.</noscript>
</body>
</html>
